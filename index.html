<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello dunia</h1>

    <button onclick="generateQR()">Click</button>

    <script>
        import QRCode from 'qrcode'

const generateQR = async (text) => {
  try {
    console.log(await QRCode.toDataURL(text))
  } catch (err) {
    console.error(err)
  }
}

generateQR("hello dunia")
    </script>
</body>
